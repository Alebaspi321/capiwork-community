<style>
  :root{--navy:#122947;--blue:#275fc8;--cyan:#13a9ad;--purple:#6754c8;--green:#118064;--yellow:#e5a332;--red:#cb4e56;--bg:#f4f7fb;--card:#fff;--text:#1b2d44;--muted:#63758b;--border:#dfe7f0;--shadow:0 16px 36px rgba(22,49,88,.08);--radius:18px}
